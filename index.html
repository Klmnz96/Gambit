<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gambit – Schach lernen und spielen</title>
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/standard.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!--Die Schachuhr: links und rechts je ein Uhrgehäuse, in der Mitte das Brett-->
    <main class="game" id="main">
      <!--Uhrgehäuse Weiß-->
      <section class="clock-case is-active" aria-label="Weiß">
        <div class="dial">
          <p class="dial-player">Weiß</p>
          <p class="dial-state">am Zug</p>
        </div>
        <p class="trainer-line">Weiß beginnt. Klicke eine deiner Figuren an.</p>
      </section>

      <!--Mitte: Name und Brett-->
      <div class="game-centre">
        <h1 class="wordmark">Gambit</h1>
        <div class="board" id="board" aria-label="Schachbrett"></div>
      </div>

      <!--Uhrgehäuse Schwarz-->
      <section class="clock-case" aria-label="Schwarz">
        <div class="dial">
          <p class="dial-player">Schwarz</p>
          <p class="dial-state">wartet</p>
        </div>
        <p class="trainer-line">Schwarz ist nach Weiß dran.</p>
      </section>
    </main>

    <!--Reihenfolge wichtig: Hilfsfunktionen und Daten zuerst, script.js zuletzt-->
    <script src="./script/helper.js"></script>
    <script src="./script/template.js"></script>
    <script src="./script/board.js"></script>
    <script src="./script/moves.js"></script>
    <script src="./script/ai.js"></script>
    <script src="./script/script.js"></script>
  </body>
</html>
