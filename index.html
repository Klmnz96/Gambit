<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141312" />
    <title>Gambit</title>
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/standard.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!--Die Schachuhr: links und rechts je ein Uhrgehäuse, in der Mitte das Brett-->
    <main class="game" id="main">
      <!--Uhrgehäuse Weiß-->
      <section class="clock-case is-active" id="clock-white" aria-label="Weiß">
        <div class="dial">
          <p class="dial-player">Weiß</p>
          <p class="dial-state">am Zug</p>
        </div>
        <p class="trainer-line">Weiß beginnt. Klicke eine deiner Figuren an.</p>
        <button
          class="trainer-toggle"
          type="button"
          data-color="white"
          aria-label="Tipps für Weiß"
          aria-pressed="true"
        >
          <span class="trainer-toggle-on" aria-hidden="true">Tipps an</span>
          <span class="trainer-toggle-off" aria-hidden="true">Tipps aus</span>
        </button>
      </section>

      <!--Mitte: Name und Brett-->
      <div class="game-centre">
        <div class="game-head">
          <button class="new-game" id="new-game" type="button" aria-label="Neue Partie">
            <svg class="new-game-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 12a8 8 0 1 0 2.6-5.9" />
              <path d="M4 4v4.5h4.5" />
            </svg>
            <span class="new-game-text" aria-hidden="true">Neue Partie</span>
          </button>
          <h1 class="wordmark" translate="no">Gambit</h1>
          <!--Erscheint erst, wenn die 3D-Ansicht bereit ist (ohne WebGL bleibt er versteckt)-->
          <button
            class="view-toggle"
            id="view-toggle"
            type="button"
            aria-label="3D-Ansicht"
            aria-pressed="false"
            hidden
          >
            <span class="view-toggle-option" data-view="2d">2D</span>
            <span class="view-toggle-option" data-view="3d">3D</span>
          </button>
        </div>

        <!--Bühne: 2D-Brett (immer da, für Tastatur und Screenreader) und 3D-Szene übereinander-->
        <div class="board-stage" id="board-stage">
          <div
            class="board"
            id="board"
            role="group"
            aria-label="Schachbrett"
          ></div>
          <div class="board-3d" id="board-3d" aria-hidden="true"></div>
        </div>

        <!--Zugprotokoll: ein Papierstreifen, pro Eintrag ein Zugpaar Weiß/Schwarz, nichts wird gelöscht.
            role="list": Safari vergisst sonst bei list-style: none, dass es eine Liste ist-->
        <ol
          class="move-list"
          id="move-list"
          role="list"
          aria-label="Zugprotokoll"
          tabindex="0"
        ></ol>
      </div>

      <!--Uhrgehäuse Schwarz-->
      <section class="clock-case" id="clock-black" aria-label="Schwarz">
        <div class="dial">
          <p class="dial-player">Schwarz</p>
          <p class="dial-state">wartet</p>
        </div>
        <p class="trainer-line">Schwarz ist nach Weiß dran.</p>
        <button
          class="trainer-toggle"
          type="button"
          data-color="black"
          aria-label="Tipps für Schwarz"
          aria-pressed="true"
        >
          <span class="trainer-toggle-on" aria-hidden="true">Tipps an</span>
          <span class="trainer-toggle-off" aria-hidden="true">Tipps aus</span>
        </button>
      </section>
    </main>

    <!--Vorleser: nur die Zeile des Spielers am Zug, damit nichts doppelt angesagt wird.
        Außerhalb von main, damit das Gehäuse Schwarz dort das letzte Kind bleibt (Handy-Reihenfolge)-->
    <p class="visually-hidden" id="announcer" aria-live="polite"></p>

    <!--Bauernumwandlung: erscheint, wenn ein Bauer die letzte Reihe erreicht.
        data-color (white/black) setzt script.js, damit die Figuren in der richtigen Farbe erscheinen-->
    <dialog
      class="promotion-dialog"
      id="promotion-dialog"
      aria-labelledby="promotion-title"
      aria-describedby="promotion-text"
    >
      <h2 class="promotion-title" id="promotion-title">Bauer umwandeln</h2>
      <p class="promotion-text" id="promotion-text">
        Dein Bauer hat die letzte Reihe erreicht. Welche Figur soll er werden?
        Die Dame ist fast immer die beste Wahl.
      </p>
      <div class="promotion-options">
          <button class="promotion-option" type="button" data-type="queen">
            <svg class="piece" aria-hidden="true">
              <use href="assets/pieces/pieces.svg#queen"></use>
            </svg>
            <span>Dame</span>
          </button>
          <button class="promotion-option" type="button" data-type="rook">
            <svg class="piece" aria-hidden="true">
              <use href="assets/pieces/pieces.svg#rook"></use>
            </svg>
            <span>Turm</span>
          </button>
          <button class="promotion-option" type="button" data-type="bishop">
            <svg class="piece" aria-hidden="true">
              <use href="assets/pieces/pieces.svg#bishop"></use>
            </svg>
            <span>Läufer</span>
          </button>
          <button class="promotion-option" type="button" data-type="knight">
            <svg class="piece" aria-hidden="true">
              <use href="assets/pieces/pieces.svg#knight"></use>
            </svg>
            <span>Springer</span>
          </button>
      </div>
    </dialog>

    <!--Reihenfolge wichtig: Hilfsfunktionen und Daten zuerst, script.js zuletzt-->
    <script src="./script/helper.js"></script>
    <script src="./script/template.js"></script>
    <script src="./script/board.js"></script>
    <script src="./script/moves.js"></script>
    <script src="./script/notation.js"></script>
    <script src="./script/draw.js"></script>
    <script src="./script/ai.js"></script>
    <script src="./script/script.js"></script>

    <!--3D-Ansicht: Three.js als ES-Modul. Die Import-Map sagt dem Browser, wo "three" liegt-->
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three/three.module.min.js",
          "three/addons/": "./assets/vendor/three/addons/"
        }
      }
    </script>
    <script type="module" src="./script/three/view.js"></script>
  </body>
</html>
